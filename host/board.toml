# rail-dut rev A: channels CH1..CH3 are the same on every board; CH4 is the device under test and
# differs per board, see boards.json. The run takes CH4's name from the board chosen in the GUI.

[channels.1]
name = "TI"
part = "LM2596S-5.0"
[channels.2]
name = "UMW"
part = "LM2596S-5.0"
[channels.3]
name = "TECH PUBLIC"
part = "LM2596S-5.0"
[channels.4]
name = "CH4 DUT"                # replaced by the chosen board's ch4
part = "LM2596S-ADJ footprint (R18 3.09k / R19 1k)"

# The boards of the campaign (CH4 DUT per board) are in boards.json; the GUI adds new ones there.

[loads]
# ohm, measured. Swapped on purpose (2026-11-22): the current rises over a point,
# LOAD1 ~0.48 A -> LOAD2 ~0.95 A -> LOAD1+2 ~1.4 A
L1 = 10.1
L2 = 5.04

[limits]
iin_max_a = 1.6      # input current above this: everything off
iload_max_a = 1.6    # INA226 full scale is 1.638 A with 50 mOhm

[defaults]
vin_points = [8.0, 16.0, 24.0]
phases = ["L1", "L2", "L12"]
phase_s = 2.5
gap_s = 1.0
